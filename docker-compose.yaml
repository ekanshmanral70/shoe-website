
services:
  app1:
    build: .
    container_name: shoezone1
    environment:
      - APP_NAME=ShoeZone-1
    expose:
      - "3001"

  app2:
    build: .
    container_name: shoezone2
    environment:
      - APP_NAME=ShoeZone-2
    expose:
      - "3002"

  app3:
    build: .
    container_name: shoezone3
    environment:
      - APP_NAME=ShoeZone-3
    expose:
      - "3003"

  nginx:
    image: nginx:alpine
    container_name: shoezone-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
      - app3

